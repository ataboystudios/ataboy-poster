<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ataboy — New York Poster</title>
  <meta name="description" content="A poster from Ataboy. New York, 2026.">
  <style>
    :root {
      --paper: #f4efe6;
      --panel: #f8f3ea;
      --ink: #111;
      --rule: rgba(17,17,17,.38);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 20;
    }
    .shell {
      width: min(1280px, calc(100% - 30px));
      margin: 0 auto;
      padding: 28px 0 54px;
    }
    .hero {
      min-height: calc(100vh - 82px);
      display: grid;
      place-items: center;
      gap: 22px;
      align-content: center;
    }
    .poster-frame {
      width: min(735px, 88vw);
      background: #fffdf7;
      border: 1px solid rgba(17,17,17,.16);
      padding: 11px;
      transform:
        perspective(900px)
        rotateX(var(--rx, 0deg))
        rotateY(var(--ry, 0deg))
        scale(var(--scale, 1));
      transition: transform .08s ease-out;
      will-change: transform;
    }
    .poster-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
    .meta {
      width: min(735px, 88vw);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      font-size: 10px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .cta {
      margin-top: 6px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 14px 22px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .cta:hover, .cta:focus-visible {
      background: var(--ink);
      color: var(--paper);
    }
    .corner-logo {
      position: fixed;
      right: 32px;
      bottom: 32px;
      width: 100px;
      max-width: 100px;
      height: auto;
      z-index: 30;
      opacity: .78;
      pointer-events: none;
      user-select: none;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      z-index: 40;
    }
    .backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: min(720px, calc(100% - 20px));
      max-height: 92vh;
      overflow: auto;
      transform: translate(-50%, 103%);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      background: var(--panel);
      border: 1px solid var(--ink);
      z-index: 50;
      padding: 24px 26px 28px;
      box-shadow: 0 -18px 60px rgba(0,0,0,.2);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--ink);
    }
    .sheet-head h1 {
      margin: 0;
      font-size: clamp(31px, 5vw, 55px);
      line-height: .95;
      letter-spacing: -.057em;
      text-transform: uppercase;
    }
    .sheet-head p {
      margin: 10px 0 0;
      font-size: 15px;
      line-height: 1.4;
    }
    .close {
      border: 0;
      background: transparent;
      font-size: 27px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
    }
    form { padding-top: 10px; }
    .row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: end;
      min-height: 50px;
      border-bottom: 1px solid var(--rule);
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .split .row:first-child {
      border-right: 1px solid var(--rule);
      padding-right: 18px;
    }
    .split .row:last-child { padding-left: 18px; }
    .split .row { grid-template-columns: 95px 1fr; }
    label {
      padding: 13px 10px 10px 0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      padding: 10px 0 9px;
      font: inherit;
      color: var(--ink);
    }
    input:focus { background: rgba(255,255,255,.28); }
    .optin {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 20px 0;
      font-size: 11px;
      line-height: 1.45;
    }
    .optin input {
      width: auto;
      margin-top: 2px;
    }
    .submit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }
    .submit {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      padding: 13px 22px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .submit[disabled] { opacity: .45; cursor: wait; }
    #status {
      min-height: 18px;
      font-size: 12px;
      text-align: right;
    }
    .footnote {
      margin-top: 18px;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(17,17,17,.65);
    }
    .success {
      display: none;
      min-height: 380px;
      place-items: center;
      text-align: center;
    }
    .success.show { display: grid; }
    .success h2 {
      margin: 0;
      font-size: clamp(50px, 10vw, 90px);
      line-height: .9;
      letter-spacing: -.065em;
      text-transform: uppercase;
    }
    .success p { margin: 18px 0 0; font-size: 17px; }
    @media (max-width: 768px) {
      .corner-logo {
        width: 70px;
        max-width: 70px;
        right: 20px;
        bottom: 20px;
      }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 18px, 1280px); }
      .hero { min-height: calc(100vh - 50px); }
      .sheet { padding: 20px 18px 24px; }
      .row { grid-template-columns: 110px 1fr; }
      .split { grid-template-columns: 1fr; }
      .split .row:first-child {
        border-right: 0;
        padding-right: 0;
      }
      .split .row:last-child { padding-left: 0; }
      .split .row { grid-template-columns: 110px 1fr; }
      .submit-row {
        align-items: flex-start;
        flex-direction: column;
      }
      #status { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
      .poster-frame { transform: none !important; }
    }
  </style>
</head>

  <div class="backdrop" id="backdrop"></div>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div id="formView">
      <div class="sheet-head">
        <div>
          <h1>We printed a poster.</h1>
          <p>Tell us where to send it.</p>
        </div>
        <button class="close" id="closeForm" aria-label="Close">×</button>
      </div>

      <form id="posterForm">
        <div class="split">
          <div class="row">
            <label for="firstName">First name *</label>
            <input id="firstName" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="row">
            <label for="lastName">Last name *</label>
            <input id="lastName" name="lastName" autocomplete="family-name" required>
          </div>
        </div>

        <div class="row">
          <label for="company">Company</label>
          <input id="company" name="company" autocomplete="organization">
        </div>

        <div class="row">
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="row">
          <label for="address1">Street address *</label>
          <input id="address1" name="address1" autocomplete="address-line1" required>
        </div>

        <div class="row">
          <label for="address2">Apt. / suite</label>
          <input id="address2" name="address2" autocomplete="address-line2">
        </div>

        <div class="split">
          <div class="row">
            <label for="city">City *</label>
            <input id="city" name="city" autocomplete="address-level2" required>
          </div>
          <div class="row">
            <label for="state">State *</label>
            <input id="state" name="state" autocomplete="address-level1" required>
          </div>
        </div>

        <div class="split">
          <div class="row">
            <label for="postalCode">ZIP *</label>
            <input id="postalCode" name="postalCode" autocomplete="postal-code" required>
          </div>
          <div class="row">
            <label for="country">Country *</label>
            <input id="country" name="country" autocomplete="country-name" value="United States" required>
          </div>
        </div>

        <label class="optin">
          <input type="checkbox" name="updates">
          <span>Occasional updates from Ataboy.</span>
        </label>

        <div class="submit-row">
          <button class="submit" id="submitButton" type="submit">Send</button>
          <div id="status" aria-live="polite"></div>
        </div>

        <div class="footnote">150 printed. Packed and mailed from our studio in New York.</div>
      </form>
    </div>

    <div class="success" id="successView">
      <div>
        <h2>Nice.</h2>
        <p>We’ll get one in the mail.</p>
      </div>
    </div>
  </section>

  <script>
    // Replace this with the /exec URL from your deployed Google Apps Script.
    const APPS_SCRIPT_ENDPOINT = "https://script.google.com/macros/s/AKfycbxcXKHEuZYicshFH3fp_cgXLfwQF1ptIs26kX6dmaohOGHk_-ZpuvvYTIZZ8eB8Fe3xNw/exec";

    const openButton = document.getElementById('openForm');
    const closeButton = document.getElementById('closeForm');
    const backdrop = document.getElementById('backdrop');
    const sheet = document.getElementById('sheet');
    const form = document.getElementById('posterForm');
    const submitButton = document.getElementById('submitButton');
    const status = document.getElementById('status');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const posterFrame = document.getElementById('posterFrame');

    function openSheet() {
      sheet.classList.add('open');
      backdrop.classList.add('open');
      sheet.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('firstName').focus(), 250);
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('open');
      sheet.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    openButton.addEventListener('click', openSheet);
    closeButton.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeSheet();
    });

    let tiltFrame;

    posterFrame.addEventListener('pointerenter', () => {
      posterFrame.style.setProperty('--scale', '1.018');
    });

    posterFrame.addEventListener('pointermove', event => {
      const rect = posterFrame.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width - 0.5;
      const y = (event.clientY - rect.top) / rect.height - 0.5;

      cancelAnimationFrame(tiltFrame);
      tiltFrame = requestAnimationFrame(() => {
        posterFrame.style.setProperty('--ry', `${x * 7}deg`);
        posterFrame.style.setProperty('--rx', `${-y * 5.5}deg`);
      });
    });

    posterFrame.addEventListener('pointerleave', () => {
      cancelAnimationFrame(tiltFrame);
      posterFrame.style.setProperty('--ry', '0deg');
      posterFrame.style.setProperty('--rx', '0deg');
      posterFrame.style.setProperty('--scale', '1');
    });

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      if (!form.reportValidity()) return;

      if (APPS_SCRIPT_ENDPOINT.includes('PASTE_YOUR')) {
        status.textContent = 'Add your Apps Script URL in Index.html first.';
        return;
      }

      submitButton.disabled = true;
      status.textContent = 'Sending…';

      const data = Object.fromEntries(new FormData(form).entries());
      data.updates = form.querySelector('[name="updates"]').checked;
      data.submittedFrom = window.location.href;

      try {
        // Apps Script responses do not expose standard CORS headers.
        // no-cors reliably sends the request; the page then shows the success state.
        await fetch(APPS_SCRIPT_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });

        form.reset();
        document.getElementById('country').value = 'United States';
        formView.style.display = 'none';
        successView.classList.add('show');
      } catch (error) {
        console.error(error);
        status.textContent = 'Something went wrong. Please try again.';
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
